<!doctype html>
<!--
  Stratified Kaplan-Meier — Bitcoin new-buyer cohort survival by halving epoch
  ────────────────────────────────────────────────────────────────────────────
  Single-file, dependency-light analysis page. Pulls public on-chain data
  from a Bitcoin Research Kit (BRK) deployment, derives a per-epoch
  new-buyer cohort, and plots the Kaplan-Meier survival curve for each
  cohort over a 0 .. (T − W) day post-onboarding horizon, where T is the
  number of days the current epoch (Epoch 5) has been in progress. T
  recomputes on every page load so the chart automatically extends by one
  day each calendar day — Epoch 5's curve is always plotted up to today,
  and prior epochs are truncated to the same days-since-halving point for
  fair cross-epoch comparison.

  Data source
  ───────────
  All inputs are pulled from BRK endpoint families at /api/series:
      utxos_under_<BAND>_old_utxo_count    (count-weighted: 1 UTXO = 1 unit)
      utxos_under_<BAND>_old_supply_sats   (BTC-weighted:   1 sat  = 1 unit)
  One series per BAND in BANDS[]. Toggle the weighting in the UI.

  Each series gives, at daily resolution, the cumulative quantity (count
  or supply) of UTXOs that were younger than BAND days at that day. Linear
  interpolation between band edges fills the gaps between BRK's discrete
  bands (1h, 1w, 1m, 2m, 3m, 4m, 5m, 6m, 1y, 2y, …).

  Count vs BTC weighting
  ──────────────────────
  Count-weighted: each UTXO contributes equally regardless of size. Robust
  to single whales but contaminated by exchange consolidation, change
  outputs, dust. Closer to the population-cohort metaphor.
  BTC-weighted: each UTXO weighted by sats. Answers the economic question
  ("what fraction of the capital onboarded in this epoch is still un-
  spent?") but very sensitive to single large actors (ETF custodians,
  treasury holders, exchange cold-wallet moves). Disagreement between the
  two views is informative — it tells you whether stickiness is broad-
  based (many holders) or concentration-driven (a few large holders).

  Math
  ────
  For epoch N (halving date H_N) with onboarding window W days, evaluated
  through follow-up day t in [0, T − W] where T = days(today − Halving 4):
      n(0) = count of UTXOs aged 0..W at observation H_N+W       (cohort)
      n(t) = count of UTXOs aged t..t+W at observation H_N+W+t   (survivors)
      d(t) = n(t-1) − n(t)                                       (events)
      S(t) = ∏_{τ ≤ t} (1 − d(τ)/n(τ-1))                          (K-M)
  Algebraically S(t) = n(t)/n(0) given no within-window censoring (true
  here). Tiny upward wiggles from band interpolation are clamped to a
  running minimum so the curve stays monotone non-increasing per K-M.

  Caveats
  ───────
  - "New buyer" is a UTXO proxy: includes coinbase, change outputs, and
    exchange-internal moves. Cross-epoch comparison stays valid because
    the same noise distribution applies to each epoch.
  - Linear interpolation between band edges is reliable below 6 months
    (1-month gaps); past 6m the gaps widen to 6 and 12 months.
  - Independence assumption violated (whales/exchanges spend many UTXOs
    at once) — variance of S(t) is underestimated. This file omits CI
    bands and significance tests deliberately for clarity.
  - Epoch 1 is excluded from the chart: 2009-2010 supply is so small
    that the cohort denominator is unstable.

  License: CC0 — public domain. Free to use, modify, redistribute.
-->

"use strict";

// ════════════════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════════════════

const BRK_API_BASE = "https://bitview.space/api/series";
const BRK_INDEX    = "day1";        // daily resolution
const CONCURRENCY  = 12;            // parallel fetch workers
const GENESIS      = new Date(Date.UTC(2009, 0, 3));
const DAY_MS       = 86400000;
const TODAY        = (() => { const d = new Date(); d.setUTCHours(0,0,0,0); return d; })();

// Halving dates. Each epoch starts on its halving block; epoch 1 starts
// at the genesis block. Epoch 5 is in progress.
const HALVING_DATES = [
  new Date(Date.UTC(2009,  0,  3)), // Epoch 1: genesis
  new Date(Date.UTC(2012, 10, 28)), // Epoch 2: halving 1
  new Date(Date.UTC(2016,  6,  9)), // Epoch 3: halving 2
  new Date(Date.UTC(2020,  4, 11)), // Epoch 4: halving 3
  new Date(Date.UTC(2024,  3, 19)), // Epoch 5: halving 4
];

// Days the current epoch (Epoch 5) has been in progress as of today.
// Recomputed on every page load — the chart automatically extends by one
// day each calendar day. All five epochs are evaluated up to this same
// days-since-halving point so cross-epoch comparison stays fair.
const PHASE_DAYS = Math.max(1, Math.floor((TODAY - HALVING_DATES[4]) / DAY_MS));

let ONBOARDING_W   = 150;           // mutable via #window-seg toggle; band-edge values only (exact N₀)
let DAYS_BEFORE    = 99;            // days before the halving the cohort window opens (#before-input); default = BlackRock IBIT launch (2024-01-11) to the 2024 halving
let WEIGHTING      = "btc";         // "btc" | "usd" — mutable via #weighting-seg toggle
let RIGHT_CENSOR   = true;          // true = cap all cohorts to the youngest epoch horizon (fair compare); false = run each to today
// Epochs toggled OFF in the legend (click a legend item to toggle). Epoch 1
// is hidden by default — its tiny 2009–2012 supply makes the cohort
// denominator unstable — but it's now selectable like any other epoch, and

// BRK age-band edges, in days. Each maps to a pair of series named
// `utxos_under_<label>_old_utxo_count` (count) and
// `utxos_under_<label>_old_supply_sats` (BTC-weighted), both exposed at
// /day1 resolution. Note that BRK uses "1h" as the smallest cumulative
// band — there is no utxos_under_1d series. Linear interpolation fills
// gaps between edges.
const BANDS = [
  ["1h",  1/24], ["1w",     7], ["1m",    30], ["2m",    60], ["3m",    90],
  ["4m",   120], ["5m",   150], ["6m",   180], ["1y",   365], ["2y",   730],
  ["3y",  1095], ["4y",  1460], ["5y",  1825], ["6y",  2190], ["7y",  2555],

// ════════════════════════════════════════════════════════════════════════════
// HELPERS — DOM, dates, fetch

function getCSS(varname) {

// Day index since the Bitcoin genesis block. BRK series are indexed by
// day starting at index 0 = genesis day, which makes lookups O(1).
function dayIdx(t) { return Math.floor((t - GENESIS) / DAY_MS); }

// Fetch one BRK series. Returns the parsed JSON object {data: [...], ...}.
async function fetchOne(metric) {
  const url = `${BRK_API_BASE}/${metric}/${BRK_INDEX}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${metric}: HTTP ${r.status}`);
  return await r.json();
}

// Fetch many BRK series in parallel with bounded concurrency.
async function fetchMany(metrics, onProgress) {
  let i = 0, done = 0;
  const results = new Array(metrics.length);
  async function worker() {
    while (i < metrics.length) {
      const idx = i++;
      try { results[idx] = await fetchOne(metrics[idx]); }
      catch (e) { results[idx] = null; console.warn(e.message); }
      done++; onProgress?.(done, metrics.length);
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  return results;
}

// In-memory cache of fetched BRK series, keyed by metric name.
const seriesByMetric = {};

// Read a value from a BRK series at a given day index. Treats null and
// out-of-range values as 0; clamps to the last value for indices past
// the series end (BRK occasionally lags behind today by a few days).
function valueAtIdx(series, idx) {
  if (!series || !series.data) return 0;
  if (idx < 0) return 0;
  if (idx >= series.data.length) return Number(series.data[series.data.length - 1] ?? 0);
  const v = series.data[idx];
  return (v == null) ? 0 : Number(v);
}

// ════════════════════════════════════════════════════════════════════════════
// AGE-BAND INTERPOLATION
// ════════════════════════════════════════════════════════════════════════════
//
// BRK exposes the cumulative-quantity series only at the discrete band edges
// listed in BANDS[]. To evaluate the cumulative quantity at an arbitrary age
// `daysX` we linearly interpolate between the two nearest edges. This is
// reliable below 6 months (band edges spaced 1 month apart) and increasingly
// approximate beyond, where the gap widens to 6 and 12 months.
//
// Returns a count when WEIGHTING="count", or a BTC-sats sum when WEIGHTING="btc".
// The survival ratio downstream is unitless either way (numerator and
// denominator share the same units).
function valueUnderDaysAtIdx(daysX, idx) {
  if (daysX <= 0) return 0;

  // Find the lower and upper band edges bracketing daysX.
  let lo = null, hi = null;
  for (const [label, d] of BANDS) {
    if (d <= daysX) lo = { label, d };
    if (d >= daysX && hi == null) hi = { label, d };
  }

  // daysX below the smallest band edge: scale the smallest band linearly.
  if (lo == null) {
    if (hi == null) return 0;
    const upper = valueAtIdx(seriesByMetric[metricName(hi.label)], idx);
    return Math.max(upper * (daysX / hi.d), 0);
  }

  // daysX exactly on a band edge OR above all edges.
  if (hi == null || hi.d === lo.d) {
    return Math.max(valueAtIdx(seriesByMetric[metricName(lo.label)], idx), 0);
  }

  // Interior case: linear interpolation between lo and hi.
  const a = valueAtIdx(seriesByMetric[metricName(lo.label)], idx);
  const b = valueAtIdx(seriesByMetric[metricName(hi.label)], idx);
  const w = (daysX - lo.d) / (hi.d - lo.d);
  return Math.max(a + w * (b - a), 0);
}

// ════════════════════════════════════════════════════════════════════════════
// STRATIFIED KAPLAN-MEIER
// ════════════════════════════════════════════════════════════════════════════
//
// For epoch N (halving date H_N) and onboarding window W:
//
//   Cohort fixed at observation date τ₀ = H_N + W:
//     n(0) = countUnderDays(W, τ₀)
//     ≡ count of UTXOs born in [H_N, H_N+W] AND still un-spent at τ₀.
//
//   For each follow-up day t ≥ 0 (observation date d = H_N + W + t):
//     The cohort UTXOs now have age in [t, t+W] days, so:
//       n(t) = countUnderDays(t+W, d) − countUnderDays(t, d)
//     Both endpoints algebraically resolve to the same birth window
//     [H_N, H_N+W], so the slice tracks exactly the original cohort.
//
//   Survival ratio:
//     S(t) = n(t) / n(0)
//
//   Equivalent to the K-M product-limit estimator
//     S(t) = ∏_{τ ≤ t} (1 − d(τ) / n(τ-1))
//   when there is no within-window censoring (true here, since all cohort
//   UTXOs are observed throughout the horizon).
//
//   By construction S(0) ≡ 1. K-M survival functions are monotonically
//   non-increasing; small upward wiggles from band interpolation are
//   clamped to a running min at the end of the loop.
//
function survivalCurve(epoch, W) {
  const startIdx  = dayIdx(epoch.start) - DAYS_BEFORE;
  const todayIdx  = dayIdx(TODAY);
  const cohortIdx = startIdx + W;
  const maxT      = RIGHT_CENSOR
    ? Math.min(PHASE_DAYS + DAYS_BEFORE - W, todayIdx - cohortIdx)
    : (todayIdx - cohortIdx);
  if (maxT < 1) return [];

  const cohort = valueUnderDaysAtIdx(W, cohortIdx);
  if (!(cohort > 0)) return [];

  const points = [{ age: 0, s: 1 }];
  for (let t = 1; t <= maxT; t++) {
    const obsIdx = cohortIdx + t;
    const upper  = valueUnderDaysAtIdx(t + W, obsIdx);
    const lower  = valueUnderDaysAtIdx(t,     obsIdx);
    const n      = Math.max(upper - lower, 0);
    points.push({ age: t, s: n / cohort });
  }

  // Monotonicity clamp: K-M is non-increasing by construction.
  let running = 1;
  for (const p of points) {
    if (p.s > running) p.s = running;
    else running = p.s;
  }
  return points;
}

// BTC price context per epoch: normalize each epoch's price to its
// onboarding-day value so the line starts at 1.0 (like the survival curve)
// and shows relative price performance over the epoch, on the SAME
// days-post-onboarding x-axis. Indexing mirrors survivalCurve exactly.
function priceCurve(epoch, W) {
  if (!priceData) return [];
  const cohortIdx = dayIdx(epoch.start) - DAYS_BEFORE + W;
  const maxT = RIGHT_CENSOR
    ? Math.min(PHASE_DAYS + DAYS_BEFORE - W, dayIdx(TODAY) - cohortIdx)
    : (dayIdx(TODAY) - cohortIdx);
  if (maxT < 1) return [];
  let base = valueAtIdx(priceData, cohortIdx);
  if (!(base > 0)) {
    // Epoch 1 onboards in 2009, before BTC had a market price. Fall back to
    // the first positive price within the window so the line still renders.
    for (let t = 1; t <= maxT; t++) {
      const px = valueAtIdx(priceData, cohortIdx + t);
      if (px > 0) { base = px; break; }
    }
  }
  if (!(base > 0)) return [];
  const pts = [];
  for (let t = 0; t <= maxT; t++) {
    const px = valueAtIdx(priceData, cohortIdx + t);
    if (px > 0) pts.push({ time: t, value: px / base });
  }
  return pts;
}
function hexToRgba(hex, a) {
  const h = String(hex).trim().replace("#", "");
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r || 0}, ${g || 0}, ${b || 0}, ${a})`;
}

function render() {
  // Clear any series from a previous render (e.g. window-size change).
  for (const s of renderedSeries) {
    try { chart.removeSeries(s); } catch (e) {}
  }
  renderedSeries = [];

  const shown = EPOCHS.filter(e => !hiddenEpochs.has(e.num));

  // Pass 1 — BTC price context lines, BEHIND the survival curves. ALL on ONE
  // shared LOG scale (upper half; bottom 50% reserved for the survival curves)
  // so the epochs stay COMPARABLE. Each line is normalized to its
  // onboarding-day value (starts at 1.0), so the shared log scale shows each
  // epoch's relative price trajectory from a common baseline — the log
  // compression keeps lower-fold-gain epochs (e.g. Epoch 5, ~1.4x) visible
  // alongside the 10-30x early bull runs, while the relative magnitude stays
  // honest. Hidden epochs are skipped here too, so a legend toggle hides an
  // epoch's survival line AND its price line together.
  for (const e of shown) {
    const pc = priceCurve(e, ONBOARDING_W);
    if (pc.length < 2) continue;
    const ps = chart.addSeries(LightweightCharts.LineSeries, {
      color: e.color,
      lineWidth: e.width,
      lineStyle: LightweightCharts.LineStyle.Solid,
      priceScaleId: "btc",
      lastValueVisible: false,
      priceLineVisible: false,
      crosshairMarkerVisible: true,
    });
    ps.setData(pc);
    renderedSeries.push(ps);
    // Mark this epoch's cycle TOP (peak) and BOTTOM (trough) on its price line.
    if (LightweightCharts.createSeriesMarkers) {
      // Cycle TOP only: the peak is captured within the window. (Cycle bottoms
      // are not marked — the bear-market low falls outside the visible window
      // and the series minimum is the onboarding-start price, not a real bottom.)
      let maxV = -Infinity, maxTi = 0;
      for (const pt of pc) {
        if (pt.value > maxV) { maxV = pt.value; maxTi = pt.time; }
      }
      const cIdx = dayIdx(e.start) - DAYS_BEFORE + ONBOARDING_W;
      const markers = [
        { time: maxTi, position: "aboveBar", color: e.color, shape: "arrowDown",
          text: `${_ui().cycle}${_ui().sp}${e.num} ${_ui().top} ` + _fmtPrice(valueAtIdx(priceData, cIdx + maxTi)) },
      ];
      try { LightweightCharts.createSeriesMarkers(ps, markers); } catch (e2) {}
    }
  }
  try {
    chart.priceScale("btc").applyOptions({
      scaleMargins: { top: 0.02, bottom: 0.50 },
      mode: LightweightCharts.PriceScaleMode.Logarithmic,
      autoScale: true,
    });
  } catch (e) {}

  // Pass 2 — Kaplan-Meier survival curves, ON TOP, on the % scale.
  const endpoints = [];
  for (const e of shown) {
    const points = survivalCurve(e, ONBOARDING_W);
    if (points.length < 2) continue;
    const data = points.map(p => ({ time: p.age, value: p.s }));
    // Area series → "volume" look: gradient from the line fading to transparent
    // at the baseline, so overlapping cohorts stay visible (solid line on top).
    const ls = chart.addSeries(LightweightCharts.AreaSeries, {
      lineColor: e.color,
      lineWidth: e.width,
      lineStyle: LightweightCharts.LineStyle.Solid,
      // Bloomberg-style wash: saturated near the line, fading to transparent.
      topColor: hexToRgba(e.color, 0.55),
      bottomColor: hexToRgba(e.color, 0.04),
      lastValueVisible: false,
      priceLineVisible: false,
      // Cap the survival y-axis at 100% (S(0)=1); bottom auto-scales.
      autoscaleInfoProvider: (orig) => {
        const r = orig();
        if (r && r.priceRange && r.priceRange.maxValue > 1) r.priceRange.maxValue = 1;
        return r;
      },
    });
    ls.setData(data);
    renderedSeries.push(ls);
    endpoints.push({ num: e.num, color: e.color, value: data[data.length - 1].value, series: ls, epoch: e });
  }
  _lastEndpoints = endpoints;

  chart.timeScale().fitContent();
  requestAnimationFrame(positionEndpointLabels);
  syncTitles();
  buildLegend();
  status.textContent = "";   // cleared on completion — credit footer is the bottom line
}

// Ensure all 19 BRK series for a given weighting mode are in seriesByMetric.
// On first call for a mode, fetches in parallel; subsequent calls are a no-op.
async function ensureModeLoaded(mode) {
  if (loadedModes.has(mode)) return true;
  const metrics = metricsForMode(mode);
  status.textContent = `Fetching 0/${metrics.length} BRK series (${MODE_LABEL[mode]} mode) ...`;
  const results = await fetchMany(metrics, (done, total) => {
    status.textContent = `Fetching ${done}/${total} BRK series (${MODE_LABEL[mode]} mode) ...`;
  });
  for (let i = 0; i < metrics.length; i++) {
    if (results[i]) seriesByMetric[metrics[i]] = results[i];
  }
  const missing = metrics.filter(m => !seriesByMetric[m]);
  if (missing.length > 0) {
    status.textContent = `Missing series: ${missing.join(", ")}. Cannot proceed in ${mode} mode.`;
    return false;
  }
  loadedModes.add(mode);
  return true;
}

buildLegend();

legendEl.addEventListener("click", (ev) => {
  const item = ev.target.closest(".legend-item[data-epoch]");
  if (!item) return;
  const num = parseInt(item.dataset.epoch, 10);
  if (hiddenEpochs.has(num)) hiddenEpochs.delete(num);
  else hiddenEpochs.add(num);
  item.classList.toggle("off", hiddenEpochs.has(num));
  render();
});

    explainerBody: `<div class="exp-title">队列BTC供应量中仍未花费的百分比</div><p><strong>本图展示。</strong> 一种原创的、按减半周期划分的比特币队列存活分析 &mdash; 每个减半周期一条 Kaplan&ndash;Meier 曲线，追踪各队列的币被花费的速度。</p><p><strong>队列。</strong> 对于减半周期 \\(\\mathrm{h}\\)，队列窗口在减半前 \\(\\mathrm{B}\\) 天开启（输入框），并跨越 \\(\\mathrm{W}\\) 天的纳入窗口。队列是在该 \\(\\mathrm{W}\\) 天窗口内创建、且在其结束时仍未花费的 UTXO 集合；以所选单位计，其规模为 \\(\\mathrm{N_0}\\)。\\(\\mathrm{B}\\) 默认为 99 &mdash; 即贝莱德 IBIT 现货 ETF 上市（2024-01-11）到 2024 年减半之间的天数。</p><p><strong>存活函数。</strong> 设 \\(\\mathrm{t}\\) 为纳入结束后的天数，\\(\\mathrm{N(t)}\\) 为第 \\(\\mathrm{t}\\) 天仍未花费的队列数量：</p>\\[\\mathrm{ S(t)=\\frac{N(t)}{N_0},\\qquad S(0)=1. }\\]<p>以乘积极限（Kaplan&ndash;Meier）形式，设 \\(\\mathrm{d_i}\\) 为第 \\(\\mathrm{i}\\) 天花费的数量，\\(\\mathrm{n_i}\\) 为其前的在险数量：</p>\\[\\mathrm{ \\hat S(t)=\\prod_{i\\,:\\,t_i\\le t}\\!\\left(1-\\frac{d_i}{n_i}\\right). }\\]<p>链上花费被完整观测，因此不存在逐币删失，两种形式一致。</p><p><strong>加权</strong> 决定 \\(\\mathrm{N}\\) 的单位：</p><ul><li><strong>BTC</strong> &mdash; \\(\\mathrm{N=\\sum_j s_j}\\)，以聪计的供应量。</li><li><strong>USD</strong> &mdash; \\(\\mathrm{N}\\) = 已实现市值 \\(\\mathrm{=\\sum_j s_j\\,p_{c(j)}}\\)：每个 UTXO 的聪 \\(\\mathrm{s_j}\\) 按其创建当日的 BTC 价格 \\(\\mathrm{p_{c(j)}}\\) 计价。</li></ul><p><strong>可比性与右删失。</strong> 图表每个日历日延长一天。当<em>右删失开启</em>（默认）时，每个队列都被截断到队列 5 已达到的随访长度，因此所有曲线共享同一时间轴 \\(\\mathrm{T-W}\\)（当前 \\(\\mathrm{T=${PHASE_DAYS}}\\) 天）并可直接比较；关闭后则将各队列追踪至今（完整历史，长度不一）。队列 1（2009&ndash;2012）默认隐藏 &mdash; 其早期供应极少使 \\(\\mathrm{N_0}\\) 不稳定，且 2010 年中之前 BTC 没有市场价格（可在图例中开启）。</p><p><strong>精度。</strong> 队列由 BRK 的年龄分段累计重建（分界点为 1、2、3、4、5、6 个月，之后为 1 年、2 年&hellip;）。纳入窗口 \\(\\mathrm{W}\\) 落在这些分界点上，故 \\(\\mathrm{N_0}\\) 精确，但一旦队列年龄超过 30 天的细分界点，曲线尾部即为插值。</p><p><strong>致谢。</strong> 本作基于 <a href="https://unchained.com/blog/hodl-waves-1/" target="_blank" rel="noopener noreferrer">Unchained Capital</a>（<a href="https://x.com/dhruvbansal" target="_blank" rel="noopener noreferrer">Dhruv Bansal</a>，2018）提出的 HODL Waves 视角，以及 <em>《Deciphering Bitcoin Blockchain Data by Cohort Analysis》</em>（Yulin Liu、<a href="https://x.com/sunshineluyao" target="_blank" rel="noopener noreferrer">Luyao Zhang</a>、Yinhong Zhao，<em>Scientific Data</em>，2022）的队列分析方法。</p>`,
  },
};
function applyLang(lang) {
  LANG = lang;
  try { document.documentElement.lang = lang; } catch (e) {}
  const _mb2 = document.querySelector("#modal .modal-body");
  if (_mb2) _mb2.dir = RTL.has(lang) ? "rtl" : "ltr";   // RTL only inside the explainer text
  const t = I18N[lang];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n; if (t[k] == null) return;
    if (k === "explainerBody") el.innerHTML = t[k];
    else el.textContent = t[k];
  });
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    const k = el.dataset.i18nTitle; if (t[k] != null) el.title = t[k];
  });
  const ll = document.getElementById("lang-label");
  if (ll) { const _ni = (LANGS.indexOf(lang) + 1) % LANGS.length; ll.textContent = LANG_NATIVE[LANGS[_ni]]; }
  syncTitles();
  buildLegend();
  if (loadedModes.has(WEIGHTING)) render();   // re-translate markers + endpoint labels
  if (window.MathJax && window.MathJax.typesetPromise) {
    const _mb = document.querySelector("#modal .modal-body");
    if (_mb) window.MathJax.typesetPromise([_mb]).catch(() => {});
  }
}
const _modalBg = document.getElementById("modal-bg");
const _modal   = document.getElementById("modal");
function _openExplainer() {
  // Re-centre on each open: clear any leftover dragged position.
  _modal.classList.remove("is-dragged");
  _modal.style.top = ""; _modal.style.left = "";
  _modalBg.classList.add("show");
}
function _closeExplainer() { _modalBg.classList.remove("show"); }
document.getElementById("btn-explainer").addEventListener("click", _openExplainer);
document.getElementById("modal-x").addEventListener("click", _closeExplainer);
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") _closeExplainer(); });
// Drag the panel by its header (grab anywhere except the close button).
const _modalHead = _modal.querySelector(".modal-head");
if (_modalHead) {
  let _drag = null;
  _modalHead.addEventListener("mousedown", (e) => {
    if (e.target.closest("#modal-x")) return;
    const rect = _modal.getBoundingClientRect();
    _modal.classList.add("is-dragged");
    _modal.style.left = rect.left + "px";
    _modal.style.top  = rect.top  + "px";
    _drag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
    e.preventDefault();
  });
  document.addEventListener("mousemove", (e) => {
    if (!_drag) return;
    let x = e.clientX - _drag.dx, y = e.clientY - _drag.dy;
    const margin = 24;
    if (x < -_modal.offsetWidth + margin) x = -_modal.offsetWidth + margin;
    if (y < 0) y = 0;
    if (x > window.innerWidth  - margin) x = window.innerWidth  - margin;
    if (y > window.innerHeight - margin) y = window.innerHeight - margin;
    _modal.style.left = x + "px";
    _modal.style.top  = y + "px";
  });
  document.addEventListener("mouseup", () => { _drag = null; });
}
document.getElementById("btn-lang").addEventListener("click", () => {
  const i = LANGS.indexOf(LANG);
  applyLang(LANGS[(i + 1) % LANGS.length]);
});
applyLang("en");

// ════════════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════════════

(async () => {
  // Fetch the band series and the price overlay CONCURRENTLY so the chart
  // appears as soon as both land — no serial second round-trip, no artificial delay.
  const [ok, pd] = await Promise.all([
    ensureModeLoaded(WEIGHTING),
    fetchOne("price").catch(() => null),   // BTC USD price for the context overlay
  ]);
  if (!ok) return;
  priceData = pd;
  render();
})();

// Segmented-toggle wiring (replaces the old <select> change handlers).
// A click on a segment sets its group's active state and runs the same
// recompute path the dropdowns used to trigger.
function _segActivate(group, value) {
  group.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.value === String(value));
  });
}
windowSeg.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-value]");
  if (!btn) return;
  ONBOARDING_W = parseInt(btn.dataset.value, 10);
  _segActivate(windowSeg, btn.dataset.value);
  status.textContent = `Recomputing for W=${ONBOARDING_W}d ...`;
  setTimeout(render, 50);
});
// Keyboard: A/← previous onboarding window, D/→ next (cycles through the toggles).
document.addEventListener("keydown", (ev) => {
  const tag = ev.target && ev.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;   // don't hijack the days-before box
  let dir = 0;
  if (ev.key === "ArrowRight" || ev.key === "d" || ev.key === "D") dir = 1;
  else if (ev.key === "ArrowLeft" || ev.key === "a" || ev.key === "A") dir = -1;
  else return;
  ev.preventDefault();
  const vals = Array.from(windowSeg.querySelectorAll("button[data-value]"))
                    .map(b => parseInt(b.dataset.value, 10));
  if (!vals.length) return;
  let idx = vals.indexOf(ONBOARDING_W);
  if (idx < 0) idx = 0;
  idx = (idx + dir + vals.length) % vals.length;
  ONBOARDING_W = vals[idx];
  _segActivate(windowSeg, String(ONBOARDING_W));
  status.textContent = `Recomputing for W=${ONBOARDING_W}d ...`;
  setTimeout(render, 50);
});

const beforeInput = document.getElementById("before-input");
const MAX_DAYS_BEFORE = 365;    // keep the cohort's max age in the densely-banded region so interpolation stays acceptable
function _applyDaysBefore() {
  let v = parseInt(beforeInput.value, 10);
  if (!Number.isFinite(v) || v < 0) v = 0;
  if (v > MAX_DAYS_BEFORE) v = MAX_DAYS_BEFORE;
  beforeInput.value = v;
  DAYS_BEFORE = v;
  status.textContent = `Recomputing (cohort opens ${v}d before halving) ...`;
  setTimeout(render, 50);
}
beforeInput.addEventListener("change", _applyDaysBefore);
beforeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); _applyDaysBefore(); } });

const censorSeg = document.getElementById("censor-seg");
censorSeg.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-value]");
  if (!btn) return;
  RIGHT_CENSOR = (btn.dataset.value === "on");
  _segActivate(censorSeg, btn.dataset.value);
  status.textContent = `Recomputing (right-censoring ${RIGHT_CENSOR ? "on" : "off"}) ...`;
  setTimeout(render, 50);
});

weightSeg.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-value]");
  if (!btn) return;
  const mode = btn.dataset.value;
  const ok = await ensureModeLoaded(mode);
  if (!ok) return;
  WEIGHTING = mode;
  _segActivate(weightSeg, WEIGHTING);
  status.textContent = `Recomputing in ${MODE_LABEL[WEIGHTING]} mode ...`;
  setTimeout(render, 50);
});

window.addEventListener("resize", () => {
  const el = document.getElementById("chart");
  chart.applyOptions({ width: el.clientWidth, height: el.clientHeight });
  requestAnimationFrame(positionEndpointLabels);
});

// Crosshair label — solid white vertical line + a box to its right showing,
// per visible cohort, the calendar date, BTC price, and % of supply still unspent.
const crossTip = document.getElementById("cross-tip");
const _chartEl = document.getElementById("chart");
function _fmtDate(ms) {
  const d = new Date(ms);
  const en = `${_WD[d.getUTCDay()]} ${d.getUTCDate()} ${_MO[d.getUTCMonth()]}' ${String(d.getUTCFullYear()).slice(-2)}`;
  if (LANG === "en") return en;
  try {
    return new Intl.DateTimeFormat(LOCALE[LANG] || "en-US",
      { weekday:"short", day:"numeric", month:"short", year:"2-digit", calendar:"gregory", timeZone:"UTC" }).format(d);
  } catch (e) { return en; }
}
function _fmtPrice(px) {
  if (!(px > 0)) return "\u2014";
  return px >= 100 ? "$" + Math.round(px).toLocaleString() : "$" + px.toFixed(2);
}
chart.subscribeCrosshairMove(param => {
  if (!crossTip) return;
  if (param.time == null || !param.point || param.point.x < 0 || param.point.y < 0) {
    crossTip.style.display = "none"; return;
  }
  const t = Number(param.time);
  let rowsHtml = "";
  let any = false;
  for (const ent of _lastEndpoints) {
    const sd = param.seriesData.get(ent.series);
    if (!sd || sd.value == null) continue;
    const openIdx = dayIdx(ent.epoch.start) - DAYS_BEFORE;        // cohort onboarding start (fixed)
    const obsIdx  = openIdx + ONBOARDING_W + t;                   // current observation day (moves w/ crosshair)
    const openMs  = GENESIS.getTime() + Math.max(0, openIdx) * DAY_MS;   // never predate genesis (Cohort 1 edge)
    const closeMs = GENESIS.getTime() + obsIdx * DAY_MS;
    const price = _fmtPrice(valueAtIdx(priceData, obsIdx));        // BTC price at this follow-up day
    const pct = (sd.value * 100).toFixed(1) + "%";
    rowsHtml += `<span class="ct-name">${_ui().cohort}${_ui().sp}${ent.num}</span>` +
            `<span class="cg-open">${_fmtDate(openMs)}</span>` +
            `<span class="cg-to">${_ui().to}</span>` +
            `<span class="cg-close">${_fmtDate(closeMs)}</span>` +
            `<span class="cg-price">${price}</span>` +
            `<span class="cg-pct">${pct}</span>`;
    any = true;
  }
  if (!any) { crossTip.style.display = "none"; return; }
  const u = _ui();
  const header = `<span class="cg-h">${u.cohort}</span>` +
                 `<span class="cg-h cg-win">${u.colWindow}</span>` +
                 `<span class="cg-h cg-price">${u.colPrice}</span>` +
                 `<span class="cg-h cg-pct">${u.colUnspent}</span>`;
  crossTip.innerHTML = `<div class="ct-head">${u.headerTpl.replace("{t}", t)}</div>` +
                       `<div class="ct-grid">${header}${rowsHtml}</div>`;
  crossTip.style.display = "block";
  const cw = _chartEl.clientWidth, ch = _chartEl.clientHeight;
  const tw = crossTip.offsetWidth, th = crossTip.offsetHeight;
  let left = param.point.x + 14;
  if (left + tw > cw) left = param.point.x - tw - 14;   // flip to the left near the right edge
  let top = param.point.y - th / 2;
  top = Math.max(2, Math.min(top, ch - th - 2));
  crossTip.style.left = Math.max(2, left) + "px";
  crossTip.style.top = top + "px";
});
</script>
